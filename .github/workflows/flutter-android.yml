name: Global Pay - Flutter Android CI

on:
  push:
    branches: [main]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
      - "test/**"
      - ".github/workflows/flutter-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
      - "test/**"
      - ".github/workflows/flutter-android.yml"

permissions:
  contents: read

jobs:
  build:
    # Skip CI until the Flutter project files are present in the repository.
    if: ${{ hashFiles('pubspec.yaml') != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-pay-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
